<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=rounded" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=rounded" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=rounded" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ንቁ" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ንቁ</title>
    <style>
      html {
        background-color: #f8fafc;
        color-scheme: light;
      }
      html.dark {
        background-color: #13161c;
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: inherit;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('vibe-theme');
          if (theme !== 'dark' && theme !== 'light') theme = 'dark';

          var lang = localStorage.getItem('vibe-lang:guest') || localStorage.getItem('vibe-lang');
          if (lang === 'am' || lang === 'en' || lang === 'om') {
            document.documentElement.lang = lang;
          }

          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            var themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) themeMeta.setAttribute('content', '#13161c');
          }
        } catch (e) {
          /* ignore boot errors */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
